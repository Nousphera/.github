name: Organization profile

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'profile/README.template.md'
      - 'profile/catalog.json'
      - '.github/workflows/profile.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'profile/README.template.md'
      - 'profile/catalog.json'
      - '.github/workflows/profile.yml'

permissions:
  contents: read

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v

  refresh:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Refresh public project statistics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_profile.py
      - name: Publish changed profile data
        run: |
          git add README.md profile/README.md profile/assets/stars-*.svg data/
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update public project star tracker'
            git push
          fi
